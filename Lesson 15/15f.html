<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 15f</title>
        <style>
            .body{
                height: 3000px;
            }
            .container{
                position: relative;
                top:20px;
                bottom:20px;
                left: 10px;
                right: 200px;
                display: inline-block;
            }
            .text{
                font-family: Arial;
                color: white;
                background-color: black;
                padding: 2px;
                position: absolute;
                top: 10px;
                right: 0px;
            }
            .bottom{
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 80px;
                background-color: rgba(255, 255, 255, 0.8);
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .cart{
                background-color: white;
                border-width: 1px;
                border-style: solid;
                border-color: black;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 15px;
                padding-right: 15px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <img class="shirt" src="shirt.jpg">
            <div class="text">20% OFF</div>
            <div class="bottom">
                <button class="cart">Add to Cart</button>
            </div>
        </div>
    </body>
</html>
